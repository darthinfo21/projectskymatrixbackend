spring.application.name=seatselection-service


server.port=8090
spring.datasource.url=jdbc:mysql://localhost:3306/skymatrixairlinesdb1
spring.datasource.username=root
spring.datasource.password=cfg@1234
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Feign client configuration
feign.hystrix.enabled=true

#Resilience4j circuit breaker
resilience4j.circuitbreaker.instances.selectSeat.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.selectSeat.slidingWindowSize=10
resilience4j.circuitbreaker.instances.selectSeat.failureRateThreshold=50

resilience4j.circuitbreaker.instances.getSeatsByFlightId.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.getSeatsByFlightId.slidingWindowSize=10
resilience4j.circuitbreaker.instances.getSeatsByFlightId.failureRateThreshold=50

resilience4j.circuitbreaker.instances.getSeatsByUserId.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.getSeatsByUserId.slidingWindowSize=10
resilience4j.circuitbreaker.instances.getSeatsByUserId.failureRateThreshold=50

